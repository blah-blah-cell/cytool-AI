[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cytool-ai"
version = "0.1.0"
description = "Local-first, modular cybersecurity automation for authorized research"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "cytool-AI contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
cytool = "cytool_ai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
