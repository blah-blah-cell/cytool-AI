[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cytool-ai"
version = "2.0.0"
description = "Local-first, modular cybersecurity automation for authorized research"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "cytool-AI contributors" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/blah-blah-cell/cytool-AI"
Repository = "https://github.com/blah-blah-cell/cytool-AI"
Issues = "https://github.com/blah-blah-cell/cytool-AI/issues"

[project.scripts]
cytool = "cytool_ai.cli:main"

[tool.setuptools.package-data]
cytool_ai = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
